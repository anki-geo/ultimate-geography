name: Brain Brew check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BRAINBREW_VERSION: 1.0.0-alpha.4
      BRAINBREW_MANIFESTS: brainbrew.yaml brainbrew-hardcore.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Brain Brew
        run: nix shell nixpkgs#cargo nixpkgs#rustc -c cargo install brainbrew --version "=$BRAINBREW_VERSION" --locked

      - name: Check translation profile consistency
        run: python scripts/check-translation-profile.py

      - name: Check shared note-type ownership
        run: python scripts/check-shared-note-types.py

      - name: Check sparse Experimental region codes
        run: "! grep -nF \"field.region-code: ''\" overlays/variants/experimental.yaml"

      - name: Verify Brain Brew workspace
        run: |
          set -euo pipefail
          for manifest in $BRAINBREW_MANIFESTS; do
            brainbrew verify --manifest "$manifest" --all-targets --media-root media
          done

      - name: Transactionally export all 100 CrowdAnki targets
        run: |
          set -euo pipefail
          rm -rf build/crowdanki
          total=0
          for manifest in $BRAINBREW_MANIFESTS; do
            mapfile -t targets < <(brainbrew targets --manifest "$manifest")
            case "$manifest" in
              brainbrew.yaml) test "${#targets[@]}" -eq 74 ;;
              brainbrew-hardcore.yaml) test "${#targets[@]}" -eq 26 ;;
            esac
            for target in "${targets[@]}"; do
              out="build/crowdanki/$target"
              brainbrew export crowdanki \
                --manifest "$manifest" --target "$target" --out "$out" \
                --media-root media --force
              test -f "$out/deck.json"
              total=$((total + 1))
            done
          done
          test "$total" -eq 100
